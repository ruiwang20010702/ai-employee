name: 生产发布门禁

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 要发布的完整 40 位小写提交 SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-employee-production-gate
  cancel-in-progress: false

jobs:
  verify:
    name: 固定提交并验证云端门禁
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: 拒绝可变引用和不完整提交编号
        id: target
        shell: bash
        env:
          AI_EMPLOYEE_TARGET_SHA: ${{ inputs.sha }}
        run: |
          if [[ ! "$AI_EMPLOYEE_TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "生产发布只接受完整的 40 位小写提交 SHA。" >&2
            exit 1
          fi
          echo "deploy_sha=$AI_EMPLOYEE_TARGET_SHA" >> "$GITHUB_OUTPUT"
      - name: 签出主分支发布控制器
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: .deployment-controller
      - name: 签出待验证的不可变目标
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.target.outputs.deploy_sha }}
          fetch-depth: 0
          path: .release-source
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: 限制为主分支已审核提交
        shell: bash
        env:
          AI_EMPLOYEE_TARGET_SHA: ${{ steps.target.outputs.deploy_sha }}
        run: |
          cd "$GITHUB_WORKSPACE/.release-source"
          test "$(/usr/bin/git rev-parse HEAD)" = "$AI_EMPLOYEE_TARGET_SHA"
          if ! /usr/bin/git merge-base --is-ancestor "$AI_EMPLOYEE_TARGET_SHA" refs/remotes/origin/main; then
            AI_EMPLOYEE_APPROVED_BASELINE="$(node -e '
              const fs = require("node:fs");
              const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.stdout.write(String(manifest.commit || ""));
            ' "$GITHUB_WORKSPACE/.deployment-controller/deploy/回退基线.json")"
            test "$AI_EMPLOYEE_TARGET_SHA" = "$AI_EMPLOYEE_APPROVED_BASELINE"
          fi
      - name: 验证目标提交的检查与安全扫描
        working-directory: .deployment-controller
        env:
          GH_TOKEN: ${{ github.token }}
          AI_EMPLOYEE_TARGET_SHA: ${{ steps.target.outputs.deploy_sha }}
        run: |
          node scripts/验证GitHub提交.mjs \
            --release-sha "$AI_EMPLOYEE_TARGET_SHA"
      - name: 记录人工发布下一步
        env:
          AI_EMPLOYEE_TARGET_SHA: ${{ steps.target.outputs.deploy_sha }}
        run: |
          echo "目标提交 $AI_EMPLOYEE_TARGET_SHA 已通过云端门禁。" >> "$GITHUB_STEP_SUMMARY"
          echo "生产执行仅允许在已登录的 macOS 用户会话使用 npm run release:local，并再次核对同一 SHA。" >> "$GITHUB_STEP_SUMMARY"
