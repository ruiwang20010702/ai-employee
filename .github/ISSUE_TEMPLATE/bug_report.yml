name: Bug report
description: Report a reproducible defect without including real messages or credentials
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Foursday. Report vulnerabilities privately through a GitHub Security Advisory.
  - type: input
    id: version
    attributes:
      label: Version
      description: Provide the release version or complete commit SHA.
      placeholder: 0.5.0 / 40-character SHA
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Product path
      options:
        - Web onboarding / GitHub delivery
        - Local demo
        - DingTalk / DWS
        - Feishu
        - Project plans / recipes
        - Memory / time return
        - Installation / deployment
        - Other or unknown
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior using synthetic or redacted data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add logs, screenshots, or test output. Never include real people, messages, tokens, database URLs, or internal material.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed real messages, personal data, credentials, and company-confidential information.
          required: true
        - label: This is not a vulnerability that requires private reporting.
          required: true
