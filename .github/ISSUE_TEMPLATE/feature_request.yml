name: Feature request
description: Propose a bounded capability with a verification and failure strategy
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the user outcome and current obstacle, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Authority and capability boundary
      description: Who may trigger it, what may it access, and when must it refuse or require approval?
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Read-back evidence and failure handling
      description: How is the final target state verified? What happens on timeout, unknown outcome, duplicate delivery, or partial failure?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
