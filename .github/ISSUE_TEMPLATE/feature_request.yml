name: 功能建议
description: 提议一个有明确边界、验证方式和失败策略的新能力
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户场景和当前阻碍，不要只写解决方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: 权限与能力边界
      description: 谁可以触发、允许访问什么、哪些情况必须拒绝或人工审批？
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 成功验证与失败处理
      description: 如何从目标系统回读成功？超时、未知结果和部分失败如何处理？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
