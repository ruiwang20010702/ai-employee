name: foursday-gbrain-memory
label: Foursday Personal gbrain Memory
kind: standalone
version: 0.1.0
description: >
  Lets Hermes submit durable, low-risk, workspace-evidenced knowledge candidates
  to Foursday's encrypted PostgreSQL queue. A host-side broker promotes accepted
  candidates through a dedicated Git checkout and exact gbrain read-back.
author: Foursday
optional_env:
  - name: FOURSDAY_MEMORY_CANDIDATE_SIDECAR
    description: "Absolute path to the Foursday memory candidate sidecar"
    prompt: "Memory candidate sidecar"
    password: false
  - name: FOURSDAY_PRODUCTION_CONFIG
    description: "Private Foursday production config used only by the host sidecar"
    prompt: "Foursday production config"
    password: false
  - name: FOURSDAY_PROJECT_REGISTRY
    description: "Private exact project registry"
    prompt: "Foursday project registry"
    password: false
