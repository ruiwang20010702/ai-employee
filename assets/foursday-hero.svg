<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Foursday — a personal-memory-driven work twin</title>
  <desc id="desc">A trusted message becomes verified work through personal memory, a real project workspace, Hermes, and Codex.</desc>
  <defs>
