      <circle cx="27" cy="19" r="0.55" fill="#10241c" opacity="0.04"/>
      <circle cx="39" cy="37" r="0.75" fill="#10241c" opacity="0.045"/>
    </pattern>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f765d"/>
      <stop offset="1" stop-color="#0f4e3c"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" rx="32" fill="#f4f1e9"/>
