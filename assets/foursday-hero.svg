<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Foursday — your open-source work twin</title>
  <desc id="desc">A governed handoff from a GitHub Issue to a verified Draft PR, designed to return one workday.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#14201b" flood-opacity="0.12"/>
    </filter>
    <pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="0.7" fill="#14201b" opacity="0.06"/>
      <circle cx="29" cy="19" r="0.6" fill="#14201b" opacity="0.05"/>
      <circle cx="42" cy="39" r="0.8" fill="#14201b" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1440" height="640" rx="32" fill="#f3f0e8"/>
  <rect width="1440" height="640" rx="32" fill="url(#grain)"/>
  <rect x="0" y="0" width="520" height="640" rx="32" fill="#14201b"/>
  <path d="M488 0h32v640h-32z" fill="#155f49" opacity="0.28"/>

  <!-- Four-day handoff mark: three focused days and one returned day. -->
  <g transform="translate(72 60)">
    <rect width="66" height="66" rx="16" fill="#fffdf8"/>
    <rect x="14" y="14" width="16" height="16" rx="4" fill="#155f49"/>
    <rect x="36" y="14" width="16" height="16" rx="4" fill="#155f49"/>
    <rect x="14" y="36" width="16" height="16" rx="4" fill="#155f49"/>
    <path d="M37 44h14m-6-6 6 6-6 6" fill="none" stroke="#155f49" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="72" y="198" fill="#a9cabb" font-size="14" font-weight="700" letter-spacing="3">YOUR OPEN-SOURCE WORK TWIN</text>
    <text x="68" y="286" fill="#fffdf8" font-size="76" font-weight="780" letter-spacing="-4">Foursday</text>
    <text x="72" y="344" fill="#cbd4cf" font-size="25">One more you.</text>
    <text x="72" y="382" fill="#fffdf8" font-size="25" font-weight="700">One less workday.</text>

    <g transform="translate(72 452)">
      <path d="M0 10h15l8 9 10-19" fill="none" stroke="#77b99d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="16" fill="#a9b8b1" font-size="15">Exact-plan approval</text>
      <path d="M0 54h15l8 9 10-19" fill="none" stroke="#77b99d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="60" fill="#a9b8b1" font-size="15">Target-system read-back</text>
      <path d="M0 98h15l8 9 10-19" fill="none" stroke="#77b99d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="104" fill="#a9b8b1" font-size="15">Human-confirmed memory and time</text>
    </g>

    <g transform="translate(594 62)" filter="url(#shadow)">
      <rect width="770" height="516" rx="24" fill="#fffdf8" stroke="#d9d7cc"/>
      <rect width="770" height="58" rx="24" fill="#f8f6ef"/>
      <path d="M0 58h770" stroke="#d9d7cc"/>
      <circle cx="28" cy="29" r="6" fill="#d2cec3"/>
      <circle cx="49" cy="29" r="6" fill="#d2cec3"/>
      <circle cx="70" cy="29" r="6" fill="#d2cec3"/>
      <rect x="110" y="17" width="312" height="24" rx="12" fill="#ebe8df"/>
      <text x="128" y="34" fill="#5f6f67" font-size="12">127.0.0.1 · governed delivery</text>

      <text x="36" y="105" fill="#155f49" font-size="11" font-weight="750" letter-spacing="2">ONE APPROVED HANDOFF</text>
      <text x="36" y="141" fill="#14201b" font-size="25" font-weight="760">GitHub Issue → verified Draft PR</text>
      <rect x="594" y="99" width="138" height="30" rx="15" fill="#dcebe3"/>
      <text x="663" y="119" text-anchor="middle" fill="#155f49" font-size="11" font-weight="750">0 silent actions</text>

      <g transform="translate(36 176)">
        <g>
          <circle cx="18" cy="20" r="18" fill="#155f49"/>
          <text x="18" y="25" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">1</text>
          <text x="54" y="18" fill="#14201b" font-size="16" font-weight="720">Bind the Issue and repository</text>
          <text x="54" y="39" fill="#5f6f67" font-size="12">Requester, commit, remote, recipe, and risk scope</text>
          <rect x="565" y="7" width="118" height="27" rx="13" fill="#dcebe3"/>
          <text x="624" y="25" text-anchor="middle" fill="#155f49" font-size="10" font-weight="750">SCOPE CHECKED</text>
        </g>
        <path d="M18 43v34" stroke="#c8c9c1" stroke-width="2" stroke-dasharray="4 5"/>
        <g transform="translate(0 78)">
          <circle cx="18" cy="20" r="18" fill="#155f49"/>
          <text x="18" y="25" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">2</text>
          <text x="54" y="18" fill="#14201b" font-size="16" font-weight="720">Review the complete plan hash</text>
          <text x="54" y="39" fill="#5f6f67" font-size="12">Patch, branch, test, push, Draft PR, and rollback</text>
          <rect x="565" y="7" width="118" height="27" rx="13" fill="#f7ead7"/>
          <text x="624" y="25" text-anchor="middle" fill="#82500b" font-size="10" font-weight="750">APPROVAL</text>
        </g>
        <path d="M18 121v34" stroke="#c8c9c1" stroke-width="2" stroke-dasharray="4 5"/>
        <g transform="translate(0 156)">
          <circle cx="18" cy="20" r="18" fill="#155f49"/>
          <text x="18" y="25" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">3</text>
          <text x="54" y="18" fill="#14201b" font-size="16" font-weight="720">Execute in an isolated worktree</text>
          <text x="54" y="39" fill="#5f6f67" font-size="12">Codex, Claude Code, or an OpenAI-compatible model</text>
          <rect x="565" y="7" width="118" height="27" rx="13" fill="#ebe8df"/>
          <text x="624" y="25" text-anchor="middle" fill="#425149" font-size="10" font-weight="750">BOUNDED</text>
        </g>
        <path d="M18 199v34" stroke="#c8c9c1" stroke-width="2" stroke-dasharray="4 5"/>
        <g transform="translate(0 234)">
          <circle cx="18" cy="20" r="18" fill="#155f49"/>
          <path d="M10 20l6 6 11-14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="54" y="18" fill="#14201b" font-size="16" font-weight="720">Read the Draft PR back</text>
          <text x="54" y="39" fill="#5f6f67" font-size="12">URL, draft state, branch, commit, title, and evidence</text>
          <rect x="565" y="7" width="118" height="27" rx="13" fill="#dcebe3"/>
          <text x="624" y="25" text-anchor="middle" fill="#155f49" font-size="10" font-weight="750">VERIFIED</text>
        </g>
      </g>

      <rect x="36" y="466" width="698" height="1" fill="#d9d7cc"/>
      <text x="36" y="493" fill="#5f6f67" font-size="12">npm start</text>
      <text x="734" y="493" text-anchor="end" fill="#155f49" font-size="12" font-weight="750">LOCAL-FIRST · DEFAULT-DENY</text>
    </g>
  </g>
</svg>
